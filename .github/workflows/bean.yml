name: Check and publish the living sky
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bean-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of all JS modules
        run: |
          node --check core.js
          node --check scene.js
          node --check game.js
      - name: Run progression and geometry tests
        run: node --test tests/*.test.cjs
      - name: Verify static page references
        run: |
          test -f index.html
          grep -q 'src="core.js"' index.html
          grep -q 'src="scene.js"' index.html
          grep -q 'src="game.js"' index.html
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
